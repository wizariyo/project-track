<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectTrack - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .color-picker {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.selected {
            border-color: #333;
            box-shadow: 0 0 0 3px white inset, 0 0 0 1px #333;
        }
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            margin: 0 auto 32px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>ProjectTrack</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" id="nav-dashboard" class="nav-item">Dashboard</a>
                <a href="profile.html" class="nav-item active">Profile</a>
                <a href="#" id="nav-logout" class="nav-item text-danger" style="margin-top: auto;">Logout</a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user flex items-center gap-sm">
                    <div class="avatar avatar-sm" id="sidebar-avatar">U</div>
                    <div class="truncate">
                        <div id="sidebar-name" style="font-weight: 600; font-size: 0.875rem;">User</div>
                        <div id="sidebar-role" style="font-size: 0.75rem; color: #6b7280; text-transform: capitalize;">Role</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <button class="hamburger" id="hamburger">☰</button>
            <div class="page-header">
                <div>
                    <h1 class="page-title">My Profile</h1>
                    <p class="page-subtitle">Manage your personal information and preferences</p>
                </div>
            </div>

            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div id="profile-avatar-large" class="profile-avatar-large" style="background-color: var(--primary);">U</div>
                
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-name">Full Name</label>
                        <input type="text" id="profile-name" class="form-control" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div id="profile-email" class="form-control" style="background: #f3f4f6; cursor: not-allowed; display: flex; align-items: center; color: #6b7280;">email@example.com</div>
                    </div>

                    <div class="flex gap-md" style="margin-bottom: 1rem;">
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Role</label>
                            <div style="padding-top: 8px;">
                                <span id="profile-role-badge" class="badge badge-primary">Student</span>
                            </div>
                        </div>
                        
                        <div class="form-group" style="flex: 1; margin-bottom: 0;">
                            <label>Branch</label>
                            <div class="form-control" style="background: #f3f4f6; cursor: not-allowed; display: flex; align-items: center; color: #6b7280; padding: 0.5rem 0.75rem;">AI</div>
                        </div>
                    </div>

                    <div class="flex gap-md" id="student-specific-fields" style="margin-bottom: 1rem;">
                        <div class="form-group" id="semester-group" style="flex: 1; margin-bottom: 0;">
                            <label for="profile-semester">Semester</label>
                            <select id="profile-semester" class="form-control">
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                            </select>
                        </div>

                        <div class="form-group" id="project-role-group" style="flex: 1; margin-bottom: 0;">
                            <label for="profile-project-role">Project Role</label>
                            <select id="profile-project-role" class="form-control">
                                <option value="Tech Lead">Tech Lead</option>
                                <option value="Developer">Developer</option>
                                <option value="Tester">Tester</option>
                                <option value="QA">QA</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Avatar Color</label>
                        <div class="color-picker" id="color-picker">
                            <div class="color-swatch" style="background-color: #6366f1;" data-color="#6366f1"></div>
                            <div class="color-swatch" style="background-color: #3b82f6;" data-color="#3b82f6"></div>
                            <div class="color-swatch" style="background-color: #10b981;" data-color="#10b981"></div>
                            <div class="color-swatch" style="background-color: #f59e0b;" data-color="#f59e0b"></div>
                            <div class="color-swatch" style="background-color: #ef4444;" data-color="#ef4444"></div>
                            <div class="color-swatch" style="background-color: #8b5cf6;" data-color="#8b5cf6"></div>
                            <div class="color-swatch" style="background-color: #ec4899;" data-color="#ec4899"></div>
                        </div>
                        <input type="hidden" id="profile-color" value="#6366f1">
                    </div>

                    <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid #e5e7eb;">
                        <button type="submit" class="btn btn-primary btn-full">Save Profile Changes</button>
                    </div>
                </form>
            </div>
            
            <div class="card" style="max-width: 600px; margin: 24px auto;">
                <h3 style="margin-bottom: 16px; font-size: 1.25rem; font-weight: 600;">Change Password</h3>
                <form id="password-form">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" class="form-control" required minlength="6" placeholder="Enter new password (min 6 characters)">
                    </div>
                    <button type="submit" class="btn btn-secondary">Update Password</button>
                </form>
            </div>

        </main>
    </div>

    <!-- Firebase CDN scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/firebase.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/firestore.js"></script>
    <script src="js/toast.js"></script>
    
    <!-- Page Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            // Init Sidebar
            const navDashboard = document.getElementById('nav-dashboard');
            navDashboard.href = user.role === 'teacher' ? 'teacher-dashboard.html' : 'student-dashboard.html';

            document.getElementById('sidebar-name').textContent = user.name;
            document.getElementById('sidebar-role').textContent = user.role;
            
            const sidebarAvatar = document.getElementById('sidebar-avatar');
            sidebarAvatar.textContent = user.name.charAt(0).toUpperCase();
            if (user.avatarColor) {
                sidebarAvatar.style.backgroundColor = user.avatarColor;
            }

            document.getElementById('nav-logout').addEventListener('click', async (e) => {
                e.preventDefault();
                await logoutUser();
                window.location.href = 'index.html';
            });

            // Mobile menu
            const hamburger = document.getElementById('hamburger');
            const sidebar = document.getElementById('sidebar');
            if(hamburger && sidebar) {
                hamburger.addEventListener('click', () => {
                    sidebar.classList.toggle('active');
                });
            }

            // Populate Form
            document.getElementById('profile-name').value = user.name || '';
            document.getElementById('profile-email').textContent = user.email || '';
            
            const roleBadge = document.getElementById('profile-role-badge');
            roleBadge.textContent = user.role.toUpperCase();
            roleBadge.className = 'badge ' + (user.role === 'teacher' ? 'badge-warning' : 'badge-primary');

            const studentFields = document.getElementById('student-specific-fields');

            if (user.role === 'teacher') {
                studentFields.style.display = 'none';
            } else {
                if (user.semester) {
                    document.getElementById('profile-semester').value = user.semester;
                }
                if (user.projectRole) {
                    document.getElementById('profile-project-role').value = user.projectRole;
                }
            }

            const largeAvatar = document.getElementById('profile-avatar-large');
            largeAvatar.textContent = user.name.charAt(0).toUpperCase();
            if (user.avatarColor) {
                largeAvatar.style.backgroundColor = user.avatarColor;
                document.getElementById('profile-color').value = user.avatarColor;
            }
            
            // Color picker logic
            const swatches = document.querySelectorAll('.color-swatch');
            const colorInput = document.getElementById('profile-color');
            
            swatches.forEach(swatch => {
                if(swatch.dataset.color === user.avatarColor) {
                    swatch.classList.add('selected');
                }
                
                swatch.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('selected'));
                    swatch.classList.add('selected');
                    const color = swatch.dataset.color;
                    colorInput.value = color;
                    largeAvatar.style.backgroundColor = color;
                    sidebarAvatar.style.backgroundColor = color;
                });
            });
            
            if(!document.querySelector('.color-swatch.selected') && swatches.length > 0) {
                const defaultColor = colorInput.value || swatches[0].dataset.color;
                const swatchToSelect = document.querySelector(`.color-swatch[data-color="${defaultColor}"]`) || swatches[0];
                swatchToSelect.classList.add('selected');
                colorInput.value = swatchToSelect.dataset.color;
                largeAvatar.style.backgroundColor = colorInput.value;
            }

            // Realtime name change on avatar
            document.getElementById('profile-name').addEventListener('input', (e) => {
                const val = e.target.value.trim();
                const initial = val ? val.charAt(0).toUpperCase() : 'U';
                largeAvatar.textContent = initial;
                sidebarAvatar.textContent = initial;
                document.getElementById('sidebar-name').textContent = val || 'User';
            });

            // Save Profile Form
            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.textContent = 'Saving...';
                btn.disabled = true;

                try {
                    const updateData = {
                        name: document.getElementById('profile-name').value.trim(),
                        avatarColor: document.getElementById('profile-color').value
                    };

                    if (user.role === 'student') {
                        updateData.semester = parseInt(document.getElementById('profile-semester').value);
                        updateData.projectRole = document.getElementById('profile-project-role').value;
                    }

                    await updateUserProfile(user.uid, updateData);
                    
                    // Update local storage
                    const updatedUser = { ...user, ...updateData };
                    setCurrentUser(updatedUser);
                    
                    showToast('Profile updated successfully!', 'success');
                } catch (error) {
                    console.error('Update profile error:', error);
                    showToast('Failed to update profile.', 'error');
                } finally {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            });
            
            // Password change form
            document.getElementById('password-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.textContent = 'Updating...';
                btn.disabled = true;
                
                try {
                    const currentUser = firebase.auth().currentUser;
                    if(currentUser) {
                        await currentUser.updatePassword(newPassword);
                        showToast('Password updated successfully', 'success');
                        document.getElementById('password-form').reset();
                    } else {
                        showToast('Session expired. Please log out and back in.', 'error');
                    }
                } catch (error) {
                    console.error('Password change error', error);
                    if(error.code === 'auth/requires-recent-login') {
                        showToast('This action requires recent login. Please re-login and try again.', 'error');
                    } else {
                        showToast(error.message || 'Failed to update password', 'error');
                    }
                } finally {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
