<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectTrack - Project Management for Students</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; }
        .hero-section { text-align: center; padding: 4rem 2rem; background: linear-gradient(135deg, var(--primary, #6366f1) 0%, var(--accent, #22d3ee) 100%); color: white; margin-bottom: -100px; padding-bottom: 150px; }
        .hero-title { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; animation: fadeDown 0.8s ease-out; }
        .hero-subtitle { font-size: 1.25rem; opacity: 0.9; max-width: 600px; margin: 0 auto; animation: fadeUp 0.8s ease-out; }
        
        .auth-wrapper { display: flex; justify-content: center; padding: 0 2rem; position: relative; z-index: 10; padding-bottom: 4rem; }
        .auth-card { background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); width: 100%; max-width: 480px; padding: 2.5rem; animation: fadeIn 0.5s ease-out; }
        
        .auth-logo { text-align: center; margin-bottom: 1.5rem; }
        .auth-logo svg { width: 56px; height: 56px; color: var(--primary, #6366f1); }
        .auth-title { font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: 0.5rem; }
        .auth-sub { text-align: center; color: #64748b; margin-bottom: 2rem; font-size: 0.95rem; }
        
        .auth-step { display: none; }
        .auth-step.active { display: block; animation: slideIn 0.3s ease-out; }
        
        .role-cards { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .role-card { flex: 1; text-align: center; padding: 2rem 1rem; border: 2px solid #e2e8f0; border-radius: 0.75rem; cursor: pointer; transition: all 0.2s ease-in-out; background: #ffffff; }
        .role-card:hover { border-color: var(--primary, #6366f1); background: #f8fafc; transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .role-card svg { width: 48px; height: 48px; margin-bottom: 1rem; color: #64748b; transition: color 0.2s; }
        .role-card:hover svg { color: var(--primary, #6366f1); }
        .role-name { font-weight: 600; font-size: 1.1rem; color: #334155; }
        
        .tabs { display: flex; border-bottom: 1px solid #e2e8f0; margin-bottom: 1.5rem; }
        .tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #64748b; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--primary, #6366f1); border-bottom-color: var(--primary, #6366f1); }
        
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #334155; font-size: 0.875rem; }
        .form-control { width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; transition: all 0.2s; background: #f8fafc; }
        .form-control:focus { outline: none; border-color: var(--primary, #6366f1); background: #ffffff; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        
        .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 0.875rem; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary { background: var(--primary, #6366f1); color: white; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2); }
        .btn-primary:hover { background: #4f46e5; box-shadow: 0 6px 8px -1px rgba(99, 102, 241, 0.3); transform: translateY(-1px); }
        .btn-ghost { background: transparent; color: #64748b; margin-top: 1rem; }
        .btn-ghost:hover { background: #f1f5f9; color: #0f172a; }
        
        .auth-error { color: #ef4444; font-size: 0.875rem; text-align: center; margin-bottom: 1.5rem; padding: 0.75rem; border-radius: 0.5rem; background: #fef2f2; border: 1px solid #fecaca; display: none; }
        .hidden { display: none !important; }
        
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="hero-section">
        <h1 class="hero-title">ProjectTrack</h1>
        <p class="hero-subtitle">The ultimate platform for students and teachers to seamlessly manage, track, and collaborate on academic projects.</p>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- Step 1: Role Selection -->
            <div id="step-role" class="auth-step active">
                <div class="auth-logo">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <h2 class="auth-title">Welcome Aboard</h2>
                <p class="auth-sub">How will you be using ProjectTrack?</p>
                
                <div class="role-cards">
                    <div class="role-card" onclick="selectRole('Student')">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14l9-5-9-5-9 5 9 5z"></path>
                            <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path>
                        </svg>
                        <div class="role-name">Student</div>
                    </div>
                    <div class="role-card" onclick="selectRole('Teacher')">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                        <div class="role-name">Teacher</div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Auth Form -->
            <div id="step-auth" class="auth-step">
                <div class="tabs">
                    <div class="tab active" id="tab-login" onclick="setMode('login')">Log In</div>
                    <div class="tab" id="tab-signup" onclick="setMode('signup')">Sign Up</div>
                </div>

                <div id="auth-error" class="auth-error"></div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    
                    <div id="signup-fields" class="hidden">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" class="form-control" placeholder="John Doe">
                        </div>

                        <div class="form-group">
                            <label for="semester">Semester</label>
                            <select id="semester" class="form-control" onchange="updateSubjects()">
                                <option value="">Select Semester</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                            </select>
                        </div>

                        <div class="form-group hidden" id="student-fields">
                            <label for="projectRole">Project Role</label>
                            <select id="projectRole" class="form-control">
                                <option value="Tech Lead">Tech Lead</option>
                                <option value="Developer">Developer</option>
                                <option value="Tester">Tester</option>
                                <option value="QA">QA</option>
                            </select>
                        </div>

                        <div class="form-group hidden" id="teacher-fields">
                            <label for="subjects">Subject</label>
                            <select id="subjects" class="form-control">
                                <option value="">Select Subject</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submit-btn">Log In</button>
                    <button type="button" class="btn btn-ghost" onclick="goBack()">Back to Roles</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- App Scripts -->
    <script src="js/firebase.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/firestore.js"></script>
    <script src="js/toast.js"></script>

    <!-- Page Logic -->
    <script>
        // State
        let selectedRole = '';
        let authMode = 'login'; // 'login' or 'signup'
        
        // DOM Elements
        const stepRole = document.getElementById('step-role');
        const stepAuth = document.getElementById('step-auth');
        const signupFields = document.getElementById('signup-fields');
        const studentFields = document.getElementById('student-fields');
        const teacherFields = document.getElementById('teacher-fields');
        const submitBtn = document.getElementById('submit-btn');
        const errorDiv = document.getElementById('auth-error');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const semesterSelect = document.getElementById('semester');
        const subjectsSelect = document.getElementById('subjects');

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const user = window.getCurrentUser ? window.getCurrentUser() : null;
            if (user) {
                redirectUser(user.role);
            }
        });

        function selectRole(role) {
            selectedRole = role;
            stepRole.classList.remove('active');
            stepAuth.classList.add('active');
            
            // Adjust fields based on role
            if (role === 'Student') {
                studentFields.classList.remove('hidden');
                teacherFields.classList.add('hidden');
            } else {
                studentFields.classList.add('hidden');
                teacherFields.classList.remove('hidden');
            }
            
            // Reset form
            document.getElementById('auth-form').reset();
            errorDiv.style.display = 'none';
            setMode('login'); // Default to login tab
        }

        function goBack() {
            stepAuth.classList.remove('active');
            stepRole.classList.add('active');
            selectedRole = '';
        }

        function setMode(mode) {
            authMode = mode;
            errorDiv.style.display = 'none';
            
            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                signupFields.classList.add('hidden');
                submitBtn.textContent = 'Log In';
                
                // Remove required attribute from signup fields
                document.getElementById('fullName').removeAttribute('required');
                document.getElementById('semester').removeAttribute('required');
            } else {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                signupFields.classList.remove('hidden');
                submitBtn.textContent = 'Sign Up';
                
                // Add required attribute to signup fields
                document.getElementById('fullName').setAttribute('required', 'true');
                document.getElementById('semester').setAttribute('required', 'true');
                
                updateSubjects(); // Initialize subjects dropdown if needed
            }
        }

        function updateSubjects() {
            if (selectedRole !== 'Teacher') return;
            
            const sem = parseInt(semesterSelect.value);
            subjectsSelect.innerHTML = '<option value="">Select Subject</option>';
            
            if (!sem || !window.getSubjects) return;
            
            const catalog = window.getSubjects();
            const filteredSubjects = catalog.filter(s => s.semester === sem);
            
            filteredSubjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.code;
                option.textContent = subject.name + ' (' + subject.code + ')';
                subjectsSelect.appendChild(option);
            });
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        async function handleAuth(e) {
            e.preventDefault();
            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (authMode === 'login') {
                    // Call global apiLogin
                    const user = await window.apiLogin(email, password);
                    if (!user) throw new Error("Invalid credentials or user not found.");
                    
                    // The returned user object should have a role, but we must also ensure 
                    // it matches what they clicked (optional, but good UX if they clicked Student but are Teacher)
                    // We'll trust the DB role for redirect
                    if (window.showToast) window.showToast('Logged in successfully!', 'success');
                    setTimeout(() => redirectUser(user.role), 500);

                } else {
                    // Signup mode
                    const name = document.getElementById('fullName').value.trim();
                    const semester = parseInt(semesterSelect.value);
                    
                    if (!name || !semester) {
                        throw new Error("Please fill in all required fields.");
                    }

                    const data = {
                        name,
                        email,
                        password,
                        role: selectedRole,
                        semester,
                        avatarColor: getRandomColor()
                    };

                    if (selectedRole === 'Student') {
                        data.projectRole = document.getElementById('projectRole').value;
                    } else if (selectedRole === 'Teacher') {
                        const subj = document.getElementById('subjects').value;
                        if (!subj) throw new Error("Please select a subject.");
                        data.subjects = [subj]; // Storing as array to support multiple in future
                    }

                    // Call global apiSignup
                    const user = await window.apiSignup(data);
                    if (!user) throw new Error("Signup failed.");
                    
                    if (window.showToast) window.showToast('Account created successfully!', 'success');
                    setTimeout(() => redirectUser(user.role), 500);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showError(error.message || "An error occurred during authentication.");
                submitBtn.disabled = false;
                submitBtn.textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
            }
        }

        function redirectUser(role) {
            if (role === 'Teacher') {
                window.location.href = 'teacher-dashboard.html';
            } else {
                window.location.href = 'student-dashboard.html';
            }
        }

        function getRandomColor() {
            const colors = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#22d3ee', '#818cf8', '#c084fc', '#f472b6'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
    </script>
</body>
</html>
