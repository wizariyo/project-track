<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple 3D WebGL Ad</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #canvas-container { width: 1920px; height: 1080px; position: absolute; top: 0; left: 0; z-index: 1; }
    .text-layer { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 2; pointer-events: none; display: flex; align-items: center; justify-content: center; }
    
    .headline {
      font-size: 120px; font-weight: 800; letter-spacing: -3px; text-align: center; color: #fff;
      opacity: 0; transform: translateY(40px); position: absolute;
    }
    
    .gradient-text {
      background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  
  <div id="canvas-container"></div>
  
  <div class="text-layer">
    <div class="headline" id="t1">The new standard.</div>
    <div class="headline" id="t2">Incredible performance.</div>
    <div class="headline" id="t3">ProjectTrack <span class="gradient-text">Pro</span></div>
  </div>
  
  <video id="videoElement" src="clip_teacher.mp4" loop muted style="display:none;"></video>

  <script>
    // 1. Setup Three.js WebGL Scene (Exactly what Apple uses for 3D web reveals)
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 10, 50);

    const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(2); // Retina quality
    container.appendChild(renderer.domElement);

    // 2. Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const spotLight = new THREE.SpotLight(0xffffff, 1.5);
    spotLight.position.set(0, 10, 10);
    spotLight.angle = Math.PI / 6;
    spotLight.penumbra = 0.5;
    scene.add(spotLight);

    // 3. Create a 3D Laptop Screen playing the video
    const video = document.getElementById('videoElement');
    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    
    // Laptop Screen
    const screenGeometry = new THREE.PlaneGeometry(16, 9);
    const screenMaterial = new THREE.MeshBasicMaterial({ map: videoTexture });
    const screenMesh = new THREE.Mesh(screenGeometry, screenMaterial);
    
    // Laptop Bezel
    const bezelGeometry = new THREE.PlaneGeometry(16.5, 9.5);
    const bezelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
    const bezelMesh = new THREE.Mesh(bezelGeometry, bezelMaterial);
    bezelMesh.position.z = -0.05;
    
    // Laptop Base (Keyboard area placeholder)
    const baseGeometry = new THREE.BoxGeometry(16.5, 0.5, 10);
    const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4, metalness: 0.6 });
    const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
    baseMesh.position.y = -4.75;
    baseMesh.position.z = 4.95;
    baseMesh.rotation.x = Math.PI / 2;

    const laptopGroup = new THREE.Group();
    laptopGroup.add(screenMesh);
    laptopGroup.add(bezelMesh);
    // laptopGroup.add(baseMesh); // Optional: add base for realistic 3D look
    scene.add(laptopGroup);

    // Initial state
    laptopGroup.position.set(0, -2, -10);
    laptopGroup.rotation.set(-0.5, 0.5, 0); // Tilted back and rotated
    laptopGroup.scale.set(0.01, 0.01, 0.01);

    // Render loop
    const animate = function () {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    };
    animate();

    // 4. GSAP Cinematic Timeline
    window.onload = () => {
      video.play();
      const tl = gsap.timeline();
      
      // Scene 1: Reveal laptop from darkness
      tl.to(laptopGroup.scale, { x: 1, y: 1, z: 1, duration: 2, ease: "power3.out" })
        .to(laptopGroup.rotation, { x: 0, y: 0, z: 0, duration: 2, ease: "power3.out" }, "-=2")
        .to(laptopGroup.position, { y: 0, z: 0, duration: 2, ease: "power3.out" }, "-=2");
        
      // Text 1
      tl.to("#t1", { opacity: 1, y: 0, duration: 1 })
        .to(laptopGroup.position, { y: -3, duration: 2, ease: "power2.inOut" }, "-=1") // Push laptop down
        .to("#t1", { opacity: 0, y: -40, duration: 1, delay: 1 });
        
      // Scene 2: Extreme 3D perspective zoom
      tl.to(laptopGroup.rotation, { x: -0.2, y: -0.6, duration: 2, ease: "power2.inOut" })
        .to(laptopGroup.position, { x: 4, y: 0, z: 5, duration: 2, ease: "power2.inOut" }, "-=2");
        
      // Text 2
      tl.to("#t2", { opacity: 1, y: 0, duration: 1 }, "-=1")
        .to("#t2", { opacity: 0, y: -40, duration: 1, delay: 1 });
        
      // Scene 3: Head on full screen
      tl.to(laptopGroup.rotation, { x: 0, y: 0, z: 0, duration: 2, ease: "power3.inOut" })
        .to(laptopGroup.position, { x: 0, y: 0, z: 3, duration: 2, ease: "power3.inOut" }, "-=2");
        
      // Text 3 (Logo)
      tl.to("#t3", { opacity: 1, scale: 1.1, duration: 1.5, ease: "back.out(1.5)" })
        .to(laptopGroup.position, { z: -20, duration: 2, ease: "power2.inOut" }, "-=1.5");
        
      // Signal finish
      tl.call(() => {
        const doneDiv = document.createElement('div');
        doneDiv.id = 'anim-done';
        document.body.appendChild(doneDiv);
      }, null, "+=1");
    };
  </script>
</body>
</html>
